<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9edf9">
<title>Tomorrow Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9edf9;--card:#fff;--ink:#262a47;--mute:#6b7092;--sun:#f4b63f;--coral:#e8603c;--mint:#2f9a7c;--line:#d5dbef}
@media(prefers-color-scheme:dark){:root{--bg:#23264a;--card:#2e3260;--ink:#eef0ff;--mute:#a4a9d4;--line:#41467a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri","Hind",system-ui,sans-serif;padding:20px 16px 90px}
main{max-width:460px;margin:0 auto}
h1{font-size:36px;line-height:1.15;margin:8px 0 2px;font-weight:700}
.tag{color:var(--mute);margin:0 0 14px}
.langs{display:flex;gap:6px;margin-bottom:16px}
.langs button{padding:6px 12px;font-size:14px;background:var(--card);border:1.5px solid var(--line)}
.langs button[aria-pressed=true]{background:var(--sun);border-color:var(--sun);color:#3a2a00}
.card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--line)}
input{width:100%;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;gap:10px}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.test{background:var(--line);flex:1}
.final{background:var(--coral);color:#fff;flex:2;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.meter{margin:18px 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--mute);font-size:15px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .4s}
.badge{display:none;background:var(--sun);color:#3a2a00;border-radius:12px;padding:8px 12px;font-weight:700;margin-top:8px}
.task{display:flex;gap:10px;align-items:center;margin-top:10px}
.task b{display:block}.task small{color:var(--mute)}
.task .t{flex:1}.task.done b{text-decoration:line-through;opacity:.55}
.mini{padding:8px 10px;font-size:14px;background:var(--line)}
.ok{background:var(--mint);color:#fff}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.ov{position:fixed;inset:0;background:rgba(20,22,50,.55);display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.dlg{background:var(--card);border-radius:20px;padding:22px;max-width:380px;width:100%}
.dlg h2{margin:0 0 6px;font-size:22px}.dlg p{margin:0 0 16px;color:var(--mute)}
.dlg button{display:block;width:100%;margin-top:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;transition:.25s;max-width:90%;text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Tomorrow Pro</h1>
  <p class="tag" data-t="tag"></p>
  <div class="langs" role="group" aria-label="Language">
    <button data-l="bn">বাংলা</button><button data-l="hi">हिन्दी</button><button data-l="en">English</button>
  </div>

  <div class="card">
    <input id="title" autocomplete="off">
    <div class="row"><input id="date" type="date"><input id="time" type="time"></div>
    <div class="row">
      <button class="test" id="test">Test</button>
      <button class="final" id="final">Final</button>
    </div>
  </div>

  <div class="meter"><span>Procrastination Meter</span><span id="cnt"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <div id="streak" class="tag" style="margin:0"></div>
  <div class="badge" id="badge">🏆 Legendary Kal-bash</div>

  <div id="list"></div>
</main>

<div class="ov" id="ov"><div class="dlg">
  <h2 data-t="dlg"></h2>
  <p id="excuse"></p>
  <button class="ok" id="y1"></button>
  <button class="test" id="y2"></button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const L={
bn:{loc:'bn-BD',
 tag:'যা আজ করা যায়, তা কাল করুন',ph:'কী কাজ করতে চাও?',
 dlg:'আজ না ভাই, কাল থেকে শুরু। কনফার্ম করবেন?',y1:'ঠিক আছে, কাল',y2:'আরও পরে',
 fToday:'আজ না, কাল করবো 😁',
 days:['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'],
 ex:[()=>'আজ শরীরটা ভালো না, কাল থেকে পাক্কা',d=>'আজ '+d+', ভালো দিন না',()=>'আগে একটু রেস্ট নাও, তারপর কাজ'],
 night:'আজ তো শেষ, কাল থেকেই ধরি',
 need:'আগে টাস্কটা তো লেখো 😅',testOk:'Test successful ✅ টাস্ক ঠিক আছে',
 d1:'ধরতে পারলে তো!',d2:'আরেকটু...',
 moved:n=>'তারিখ হয়ে গেছে আজ + '+n+' দিন 😂',
 done:'আপনি সত্যিই করলেন?! 😱 এটা তো ফিচারে ছিল না',
 empty:'কোনো টাস্ক নেই। (কাল দেবো)',cnt:n=>n+' বার পিছিয়েছে',
 streak:n=>'টানা '+n+' দিন কাজ পিছিয়েছেন!',tmr:'কাল করবো',del:'মুছো'},
hi:{loc:'hi-IN',
 tag:'जो आज हो सकता है, उसे कल करो',ph:'क्या काम करना है?',
 dlg:'आज नहीं भाई, कल से शुरू। कन्फर्म करें?',y1:'ठीक है, कल',y2:'और बाद में',
 fToday:'आज नहीं, कल करूँगा 😁',
 days:['रविवार','सोमवार','मंगलवार','बुधवार','गुरुवार','शुक्रवार','शनिवार'],
 ex:[()=>'आज तबीयत ठीक नहीं, कल से पक्का',d=>'आज '+d+' है, अच्छा दिन नहीं',()=>'पहले थोड़ा आराम करो, फिर काम'],
 night:'आज तो खत्म, कल से ही शुरू करते हैं',
 need:'पहले टास्क तो लिखो 😅',testOk:'Test successful ✅ टास्क ठीक है',
 d1:'पकड़ सको तो पकड़ो!',d2:'थोड़ा और...',
 moved:n=>'तारीख हो गई आज + '+n+' दिन 😂',
 done:'आपने सच में कर दिया?! 😱 ये तो फीचर में था ही नहीं',
 empty:'कोई टास्क नहीं। (कल दूँगा)',cnt:n=>n+' बार टला',
 streak:n=>'लगातार '+n+' दिन काम टाला!',tmr:'कल करूँगा',del:'हटाओ'},
en:{loc:'en',
 tag:'Why do today what you can do tomorrow',ph:'What do you need to do?',
 dlg:'Not today, buddy. Starting tomorrow. Confirm?',y1:'Okay, tomorrow',y2:'Even later',
 fToday:'Not today, tomorrow 😁',
 days:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
 ex:[()=>'Not feeling great today, tomorrow for sure',d=>"It's "+d+", not a good day",()=>'Rest first, then work'],
 night:"Today's already over, let's start tomorrow",
 need:'Write the task first 😅',testOk:'Test successful ✅ Task looks fine',
 d1:'Catch me if you can!',d2:'Almost...',
 moved:n=>'Date is now today + '+n+' day'+(n>1?'s':'')+' 😂',
 done:"You actually did it?! 😱 That wasn't in the features",
 empty:'No tasks. (Will add tomorrow)',cnt:n=>'Postponed '+n+' times',
 streak:n=>'Postponed '+n+' days in a row!',tmr:'Tomorrow',del:'Delete'}
};
let S={tasks:[],streak:0,last:'',lang:'bn'};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('tomorrow-pro')))}catch(e){}
const save=()=>{try{localStorage.setItem('tomorrow-pro',JSON.stringify(S))}catch(e){}};
const T=()=>L[S.lang]||L.bn;
const nf=n=>Number(n).toLocaleString(T().loc);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

function excuse(){
  const d=new Date(),t=T();
  if(d.getHours()<5)return t.night;
  return t.ex[Math.floor(Math.random()*3)](t.days[d.getDay()]);
}
function valid(){
  if(!$('#title').value.trim()){toast(T().need);$('#title').focus();return false}
  return true;
}
function syncFinal(){$('#final').textContent=$('#date').value===today()?T().fToday:'Final'}
function bump(){
  const t=today();
  if(S.last!==t){S.streak=(S.last===addDays(t,-1))?S.streak+1:1;S.last=t}
}
function postpone(id,n){
  const k=S.tasks.find(x=>x.id===id);if(!k)return;
  k.date=addDays(k.date,n);k.delays++;bump();save();render();
}

$('#test').onclick=()=>{if(valid())toast(T().testOk)};

let dodge=0;
$('#final').onclick=e=>{
  if(!valid())return;
  const b=e.currentTarget;
  if(dodge<2){
    dodge++;
    b.style.transform='translate('+(Math.random()*90-45)+'px,'+(Math.random()*50-25)+'px)';
    toast(dodge===1?T().d1:T().d2);
    return;
  }
  dodge=0;b.style.transform='';
  $('#excuse').textContent=excuse();
  $('#ov').classList.add('on');
};

function confirmTask(n){
  const date=$('#date').value||today();
  S.tasks.unshift({id:Date.now(),title:$('#title').value.trim(),date:addDays(date,n),time:$('#time').value,delays:1,done:false});
  bump();save();
  $('#ov').classList.remove('on');
  $('#title').value='';$('#date').value=today();syncFinal();
  toast(T().moved(nf(n)));
  render();
}
$('#y1').onclick=()=>confirmTask(1);
$('#y2').onclick=()=>confirmTask(2);
$('#date').onchange=syncFinal;

function render(){
  const t=T();
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===S.lang));
  $('#title').placeholder=t.ph;$('#y1').textContent=t.y1;$('#y2').textContent=t.y2;
  syncFinal();
  const total=S.tasks.reduce((a,x)=>a+x.delays,0);
  $('#cnt').textContent=t.cnt(nf(total));
  $('#fill').style.width=Math.min(total*10,100)+'%';
  $('#badge').style.display=total>=10?'block':'none';
  $('#streak').textContent=S.streak>=2?t.streak(nf(S.streak)):'';
  const list=$('#list');
  if(!S.tasks.length){list.innerHTML='<div class="empty">'+t.empty+'</div>';return}
  list.innerHTML=S.tasks.map(k=>'<div class="card task'+(k.done?' done':'')+'"><div class="t"><b>'+esc(k.title)+'</b><small>'+k.date+(k.time?' · '+k.time:'')+' · '+t.cnt(nf(k.delays))+'</small></div>'
    +(k.done?'':'<button class="mini" data-p="'+k.id+'">'+t.tmr+'</button><button class="mini ok" data-d="'+k.id+'">Done</button>')
    +'<button class="mini" data-x="'+k.id+'" aria-label="'+t.del+'">✕</button></div>').join('');
}
$('#list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=+(b.dataset.p||b.dataset.d||b.dataset.x);
  if(b.dataset.p)postpone(id,1);
  else if(b.dataset.d){const k=S.tasks.find(x=>x.id===id);k.done=true;save();render();toast(T().done)}
  else{S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
};
document.querySelector('.langs').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  S.lang=b.dataset.l;save();render();
};

$('#date').value=today();
const n=new Date();$('#time').value=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
render();
</script>
</body>
</html>
